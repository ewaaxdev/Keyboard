# Setiap ada push, rakit APK debug otomatis dan simpan sebagai artifact.
name: build

on: [push]

jobs:
  build:
    # Dikunci ke 24.04 agar tidak kaget saat ubuntu-latest pindah versi.
    runs-on: ubuntu-24.04
    steps:
      # Ambil kode dari repo.
      - uses: actions/checkout@v5

      # Siapkan JDK 17 (syarat AGP 9).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Rakit APK debug pakai Gradle wrapper bawaan repo.
      - run: ./gradlew assembleDebug

      # Simpan hasil APK supaya bisa diunduh dari halaman Actions.
      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
